# iDispatchX test stack — single-instance, no reverse proxy
#
# All data is baked into custom Docker images; no bind mounts or named volumes
# are used (the Docker socket in this environment does not permit them).
#
# Prerequisites (run from Implementation/):
#   ./deploy/docker/test/start.sh   — builds all images and starts all services
#   ./deploy/docker/test/stop.sh    — stops all services
#
# PostGIS data is ephemeral (no persistent volume); the gis-data-seeder
# re-seeds geocoding data on every fresh stack start.

# Explicit project name prevents Docker from using the directory name ("docker"),
# which would clash with the production docker-compose.yml in the same directory.
name: idispatchx-test

services:

  # --------------------------------------------------------------------------
  # Keycloak — OIDC provider for the test stack
  # Realm JSON is baked into the image via Dockerfile.keycloak.
  # --------------------------------------------------------------------------
  keycloak:
    image: idispatchx/keycloak-test
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"\\\"UP\\\"\"'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  # --------------------------------------------------------------------------
  # GIS Database (PostGIS)
  # No persistent volume — data is re-seeded by gis-data-seeder on each start.
  # Postgres superuser used so Flyway can CREATE EXTENSION without a separate
  # init script. Test-only — not permitted in production.
  # --------------------------------------------------------------------------
  gis-db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: gisdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gisdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # GIS Server — single replica
  # Tile fixtures are baked into the image via Dockerfile.gis-server-test.
  # Starts after the data-seeder has seeded the DB (so both Flyway and the
  # seeder run only once; the GIS Server then finds the schema already in place).
  # --------------------------------------------------------------------------
  gis-server:
    image: idispatchx/gis-server-test
    depends_on:
      gis-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gis-data-seeder:
        condition: service_completed_successfully
    environment:
      GIS_SERVER_PORT: "8080"
      GIS_TILE_DIR: /tiles
      GIS_CONTEXT_PATH: ""
      GIS_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      GIS_DB_URL: jdbc:postgresql://gis-db:5432/gisdb
      GIS_DB_USER: postgres
      GIS_DB_PASSWORD: testpassword
      GIS_OIDC_ISSUER: http://keycloak:8080/realms/idispatchx
      GIS_OIDC_JWKS_URL: http://keycloak:8080/realms/idispatchx/protocol/openid-connect/certs
      GIS_OIDC_CLIENT_ID: gis-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"\\\"UP\\\"\"'"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  # --------------------------------------------------------------------------
  # GIS Data Seeder — one-shot container; seeds geocoding data once the DB is
  # ready. Runs before the GIS Server so the DB schema is created by the
  # importer's Flyway; the GIS Server then finds the schema already in place.
  # --------------------------------------------------------------------------
  gis-data-seeder:
    image: idispatchx/gis-data-seeder
    depends_on:
      gis-db:
        condition: service_healthy
    environment:
      GIS_DB_URL: jdbc:postgresql://gis-db:5432/gisdb
      GIS_DB_USER: postgres
      GIS_DB_PASSWORD: testpassword
