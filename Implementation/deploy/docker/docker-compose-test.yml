# iDispatchX test stack — single-instance, no reverse proxy
#
# Intended for manual testing with real NLS sample data.
# E2E tests continue to use mocks and do not use this stack.
#
# Prerequisites (run from Implementation/):
#   ./deploy/docker/test/start.sh   — builds images and starts all services
#   ./deploy/docker/test/stop.sh    — stops all services and removes the DB volume
#
# Tile data is bind-mounted from SampleData/tiles/ (pre-generated; see Task 1.1/1.2).
# Geocoding data is seeded at startup by the gis-data-seeder one-shot container.

# Explicit project name prevents Docker from using the directory name ("docker"),
# which would clash with the production docker-compose.yml in the same directory.
name: idispatchx-test

services:

  # --------------------------------------------------------------------------
  # Keycloak — OIDC provider for the test stack
  # --------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./test/keycloak-test-realm.json:/opt/keycloak/data/import/idispatchx-realm.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  # --------------------------------------------------------------------------
  # GIS Database (PostGIS)
  # Postgres superuser used so Flyway can CREATE EXTENSION without a separate
  # init script. Test-only — not permitted in production.
  # --------------------------------------------------------------------------
  gis-db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: gisdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
    volumes:
      - gis_test_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gisdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # GIS Server — single replica
  # --------------------------------------------------------------------------
  gis-server:
    image: idispatchx/gis-server
    depends_on:
      gis-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      GIS_SERVER_PORT: "8080"
      GIS_TILE_DIR: /tiles
      GIS_CONTEXT_PATH: ""
      GIS_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      GIS_DB_URL: jdbc:postgresql://gis-db:5432/gisdb
      GIS_DB_USER: postgres
      GIS_DB_PASSWORD: testpassword
      GIS_OIDC_ISSUER: http://keycloak:8080/realms/idispatchx
      GIS_OIDC_CLIENT_ID: gis-server
    volumes:
      - ../../../SampleData/tiles:/tiles:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  # --------------------------------------------------------------------------
  # GIS Data Seeder — one-shot container; seeds geocoding data after GIS Server
  # is healthy. Runs the GIS Data Importer against the NLS GML ZIP files.
  # --------------------------------------------------------------------------
  gis-data-seeder:
    image: eclipse-temurin:25-jre
    depends_on:
      gis-server:
        condition: service_healthy
    volumes:
      - ../../../SampleData:/data:ro
      - ../../../Implementation/tools/gis-data-importer/target/gis-data-importer-1.0.0-SNAPSHOT-dist.tar.gz:/app/gis-data-importer-dist.tar.gz:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /tmp
        tar -xzf /app/gis-data-importer-dist.tar.gz
        IMPORTER_DIR=$(ls -d gis-data-importer-*)
        JAVA_OPTS="-Xmx1g" bash "$${IMPORTER_DIR}/gis-data-importer.sh" \
          --municipalities /data/municipalities/codelist_kunta_1_20260101.json \
          --input-dir /data/maastotietokanta/avoin/etrs89/gml/L3/L33 \
          --db-url jdbc:postgresql://gis-db:5432/gisdb \
          --db-user postgres \
          --db-password testpassword \
          --truncate

# --------------------------------------------------------------------------
# Named volumes
# --------------------------------------------------------------------------
volumes:
  gis_test_db_data:
