name: Supply Chain Security

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"

jobs:
  npm-minimum-release-age:
    name: NPM Minimum Release Age
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Requires npm >=11.10.0, which ships with Node.js 22 LTS, for the
          # native min-release-age .npmrc setting to be available in client projects.
          node-version: "22"

      - name: Check NPM package minimum release age
        # Primary enforcement is .npmrc min-release-age=3 in each client project.
        # This step is a CI-level backstop that validates the committed lockfiles
        # directly against the registry, catching any packages that bypassed .npmrc.
        run: |
          readarray -t LOCKFILES < <(find . \
            -name "package-lock.json" \
            -not -path "*/node_modules/*" \
            -not -path "*/.claude/*")
          node scripts/check-npm-package-age.mjs "${LOCKFILES[@]}"
        env:
          MIN_AGE_DAYS: 3
